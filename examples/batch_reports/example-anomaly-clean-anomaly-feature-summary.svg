<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300"
  viewBox="0 0 400 300" role="img" aria-labelledby="title desc">
  <title id="title">Anomaly Scored Feature Summary</title>
  <desc id="desc">Deterministic rendering of persisted candidate feature values for review context only; not evidence of a confirmed technosignature.</desc>
  <style>
    .title { font: 700 17px sans-serif; fill: #0f172a; }
    .small { font: 12px sans-serif; fill: #334155; }
    .value { font: 600 12px monospace; fill: #0f172a; }
    .note { font: 11px sans-serif; fill: #475569; }
  </style>
  <rect x="0" y="0" width="400" height="300" fill="#f8fafc"/>
  <text x="24" y="28" class="title">Anomaly Scored Feature Summary</text>
  <rect x="30" y="48" width="340" height="25" fill="#e2e8f0"/>
  <text x="42" y="66" class="small">crossmatch_confidence</text>
  <text x="350" y="66" text-anchor="end" class="value">0.9</text>
  <rect x="30" y="75" width="340" height="25" fill="#f1f5f9"/>
  <text x="42" y="93" class="small">artifact_score</text>
  <text x="350" y="93" text-anchor="end" class="value">0.02</text>
  <rect x="30" y="102" width="340" height="25" fill="#e2e8f0"/>
  <text x="42" y="120" class="small">data_quality_score</text>
  <text x="350" y="120" text-anchor="end" class="value">0.9</text>
  <rect x="30" y="129" width="340" height="25" fill="#f1f5f9"/>
  <text x="42" y="147" class="small">provenance_completeness_score</text>
  <text x="350" y="147" text-anchor="end" class="value">0.9</text>
  <text x="24" y="284" class="note">Deterministic rendering of persisted candidate feature values for review context only; not evidence of a confirmed technosignature.</text>
</svg>
